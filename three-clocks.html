<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <title>Reykjavik · Prague · Island Heights — Desktop Clocks</title>
 <link rel="icon" type="image/svg+xml" href="./favicon.svg">
 <link rel="stylesheet" href="./three-clocks.css">
</head>
<body>
 <main class="three-clocks" aria-label="Three live astronomical clocks">
  <section class="clock-panel" data-zone="Atlantic/Reykjavik" aria-labelledby="reykjavik-heading">
   <iframe title="Live Reykjavik astronomical clock with Icelandic flag" src="./clock-pane.html?desktop=1&amp;location=reykjavik&amp;theme=iceland&amp;size=95&amp;readout=0&amp;position=center&amp;background=black&amp;dst=1" tabindex="-1"></iframe>
   <div class="clock-label"><h1 id="reykjavik-heading">Reykjavik</h1><time></time><p class="local-date"></p></div>
  </section>
  <section class="clock-panel" data-zone="Europe/Prague" aria-labelledby="prague-heading">
   <iframe title="Live Prague astronomical clock with blue dial background" src="./clock-pane.html?desktop=1&amp;location=prague&amp;size=95&amp;readout=0&amp;position=center&amp;background=black&amp;dst=1" tabindex="-1"></iframe>
   <div class="clock-label"><h1 id="prague-heading">Prague</h1><time></time><p class="local-date"></p></div>
  </section>
  <section class="clock-panel" data-zone="America/New_York" aria-labelledby="island-heights-heading">
   <iframe title="Live Island Heights astronomical clock with gray dial background" src="./clock-pane.html?desktop=1&amp;location=islandheights&amp;theme=gray&amp;size=95&amp;readout=0&amp;position=center&amp;background=black&amp;dst=1" tabindex="-1"></iframe>
   <div class="clock-label"><h1 id="island-heights-heading">Island Heights</h1><time></time><p class="local-date"></p></div>
  </section>
 </main>
 <script type="module" src="./three-clocks.js"></script>
</body>
</html>
